<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<style>

*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--tx);background:#111;overflow:hidden}
#map{position:fixed;inset:0}
.g{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:.5px solid var(--sep);box-shadow:0 8px 30px rgba(0,0,0,.25)}

#cameraBox{width:min(680px,100%);border-radius:18px;padding:14px}
#camVideo{width:100%;max-height:68vh;object-fit:contain;background:#000;border-radius:12px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
h3{margin:12px 0 6px;font-size:13px;font-weight:600;color:var(--sub)}
p{margin:2px 0;color:var(--sub)}
.x{border:0;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--sub);cursor:pointer;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid div{background:var(--fill);border-radius:12px;padding:8px 10px}
.grid b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.grid span{font-size:12px;color:var(--sub)}
svg.sp{width:100%;height:40px;display:block;background:var(--fill);border-radius:10px}
input[type=range]{width:100%;accent-color:var(--blue)}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;border-radius:12px;height:44px;background:var(--blue);color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.s{background:var(--fill);color:var(--blue)}
.list{background:var(--fill);border-radius:12px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:.5px solid var(--sep)}
.li:first-child{border-top:0}
.bar2{height:8px;border-radius:4px;background:var(--blue);min-width:2px}
select,.in{width:100%;height:40px;border-radius:10px;border:0;background:var(--fill);color:var(--tx);font:inherit;padding:0 12px}
#tabs{position:fixed;left:10px;right:10px;max-width:520px;margin:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:56px;border-radius:28px;display:flex;z-index:7}
#tabs button{flex:1;border:0;background:none;color:var(--sub);font:500 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
#tabs button i{font-style:normal;font-size:19px}
#tabs button.on{color:var(--blue)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);z-index:9;padding:10px 16px;border-radius:14px;font-weight:600;display:none;max-width:90%}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}
</style>
</head>

</nav>
<script>

let selectedLocation={lat:18.52,lon:73.86,name:'Pune map start'},weather=null,weatherMessage='Waiting for location…',weatherRequestedAt=0,weatherRequestSeq=0,weatherNextAllowedAt=0,nominatimNextAt=0,nominatimQueue=Promise.resolve(),wakeLock=null,keepAwake=false,compassOn=false,cameraStream=null,swRegistration=null;

const AIRCRAFT_FEEDS=[
 {id:'airplanes',name:'Airplanes.Live',minInterval:0,url:(lat,lon,nm)=>`https://api.airplanes.live/v2/point/${lat}/${lon}/${nm}`},
 {id:'adsbfi',name:'ADSB.fi',minInterval:1000,url:(lat,lon,nm)=>`https://opendata.adsb.fi/api/v3/lat/${lat}/lon/${lon}/dist/${nm}`},
 {id:'adsblol',name:'ADS-B.lol',minInterval:180000,url:(lat,lon,nm)=>`https://api.adsb.lol/v2/lat/${lat}/lon/${lon}/dist/${nm}`}
];
const nm=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 6371/1.852*2*Math.asin(Math.sqrt(x))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function fetchJson(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);try{const r=await fetch(url,{signal:controller.signal});if(!r.ok){const e=Error(`HTTP ${r.status}`);e.status=r.status;e.retryAfter=r.headers.get('Retry-After');throw e}return await r.json()}finally{clearTimeout(timer)}}

 try{return{data:await fetchAircraftPayload(url),transport:'direct'}}catch(err){if(err.status)throw err;let last=err;
  const proxies=[['Vercel proxy',u=>`https://radar-046-proxy.vercel.app/?url=${encodeURIComponent(u)}`],['AllOrigins',u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`]];

}
function normaliseFeed(rows){
 if(!Array.isArray(rows))throw Error('unexpected aircraft response format');
 return rows.filter(a=>a&&(a.lat??a.latitude)!=null&&(a.lon??a.lng??a.longitude)!=null).map(a=>{
  const rawAlt=a.alt_baro??a.altitude??a.alt??0,alt=rawAlt==='ground'?0:Number(rawAlt);
  return{id:String(a.hex??a.icao24??a.icao??'').toLowerCase(),cs:String(a.flight??a.callsign??'').trim(),reg:a.r??a.registration??'',type:a.t??a.type??'',op:a.ownOp??a.operator??a.desc??'',lat:Number(a.lat??a.latitude),lon:Number(a.lon??a.lng??a.longitude),alt:Number.isFinite(alt)?Math.round(alt):0,gs:Math.round(Number(a.gs??a.speed??0)||0),trk:Math.round(Number(a.track??a.trk??0)||0),vr:Math.round(Number(a.baro_rate??a.vr??0)||0),sq:String(a.squawk??a.sq??'')}
 }).filter(a=>a.id&&Number.isFinite(a.lat)&&Number.isFinite(a.lon)&&Math.abs(a.lat)<=90&&Math.abs(a.lon)<=180)

async function fetchAircraftFallback(lat,lon,radius){

 for(const feed of ordered){const until=Math.max(providerRetryAt.get(feed.id)||0,Number(ls(`feedCooldown:${feed.id}`,0)));if(until>now)continue;

  try{
   const result=await fetchWithCorsFallback(url),rows=result.data?.ac??result.data?.aircraft??result.data?.states??[],list=normaliseFeed(rows);
   providerFailures.set(feed.id,0);providerRetryAt.set(feed.id,now+feed.minInterval);if(feed.id==='adsblol')sv(`feedCooldown:${feed.id}`,now+feed.minInterval);
   return{list,source:feed.name,transport:result.transport}
  }catch(err){errors.push(`${feed.name}: ${err.message}`);const failures=(providerFailures.get(feed.id)||0)+1;providerFailures.set(feed.id,failures);const retry=Math.max(0,Number(err.retryAfter)||0)*1000,delay=err.status===429?Math.max(60000,retry):err.status===403?300000:Math.min(60000*2**(failures-1),600000);providerRetryAt.set(feed.id,now+delay);sv(`feedCooldown:${feed.id}`,now+delay)}
 }
 const wait=Math.min(...AIRCRAFT_FEEDS.map(f=>Math.max(0,Math.max(providerRetryAt.get(f.id)||0,Number(ls(`feedCooldown:${f.id}`,0)))-now)));

function requestNominatim(url){

}
const geocoderBase=()=>ls('geocoderBase','https://nominatim.openstreetmap.org').replace(/\/+$/,'');
async function searchPlace(query){

  let place=locationCache.get('search:'+key);
  if(!place){const u=new URL(`${geocoderBase()}/search`);u.search=new URLSearchParams({format:'jsonv2',limit:'1',q:query}).toString();const rows=await requestNominatim(u);place=rows?.[0];if(!place)throw Error('No matching place');locationCache.set('search:'+key,place)}
  const lat=Number(place.lat),lon=Number(place.lon);qs='';$('#q').value='';setSelectedLocation(lat,lon,place.display_name||query,false);map.flyTo({center:[lon,lat],zoom:10});draw();toast('Map moved to '+(place.name||query));
 }catch(e){toast('Place search failed: '+e.message)}
}
function setSelectedLocation(lat,lon,name,reverse=true){
 if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;
 selectedLocation={lat,lon,name:name||`${lat.toFixed(3)}, ${lon.toFixed(3)}`};weather=null;weatherMessage='Loading weather…';loadWeather(lat,lon);
 if(reverse)reversePlace(lat,lon);if(tab!=='map')panel();
}
async function reversePlace(lat,lon){
 const key=`reverse:${lat.toFixed(3)},${lon.toFixed(3)}`;let name=locationCache.get(key);
 try{
  if(!name){const u=new URL(`${geocoderBase()}/reverse`);u.search=new URLSearchParams({format:'jsonv2',lat:String(lat),lon:String(lon),zoom:'10'}).toString();const result=await requestNominatim(u);name=result?.name||result?.address?.city||result?.address?.town||result?.address?.village||result?.display_name;if(!name)throw Error('No place name returned');locationCache.set(key,name)}
 }catch{
  try{if(!name){const result=await fetchJson(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);name=result.city||result.locality||result.principalSubdivision||result.countryName;if(name)locationCache.set(key,name)}}catch{}
 }
 if(name&&selectedLocation.lat===lat&&selectedLocation.lon===lon){selectedLocation.name=name;if(tab!=='map')panel()}
}
async function loadWeather(lat,lon){
 const key=`${lat.toFixed(2)},${lon.toFixed(2)}`,cached=weatherCache.get(key);
 if(cached&&Date.now()-cached.at<900000){weather=cached.data;weatherRequestedAt=cached.at;weatherMessage='';if(tab!=='map')panel();return}
 if(Date.now()<weatherNextAllowedAt){weatherMessage='Weather refresh is rate-limited; try again in a few seconds.';if(tab!=='map')panel();return}
 weatherNextAllowedAt=Date.now()+15000;
 const requestId=++weatherRequestSeq;weatherRequestedAt=requestId;
 try{
  const query=new URLSearchParams({latitude:lat.toFixed(4),longitude:lon.toFixed(4),current:'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m',timezone:'auto'});

const fc=f=>({type:'FeatureCollection',features:f});
const pt=(lon,lat,p={})=>({type:'Feature',properties:p,geometry:{type:'Point',coordinates:[lon,lat]}});
const tile=()=>({type:'raster',tileSize:256,attribution:'© OpenStreetMap contributors',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png']});
const map=new maplibregl.Map({container:'map',center:[73.86,18.52],zoom:7,attributionControl:false,
 style:{version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',sources:{d:tile('dark'),l:tile('light')},layers:[{id:'d',type:'raster',source:'d'},{id:'l',type:'raster',source:'l'}]}});
function theme(t){document.documentElement.dataset.theme=t;if(map.getLayer('d')){map.setLayoutProperty('d','visibility',t==='dark'?'visible':'none');map.setLayoutProperty('l','visibility',t==='dark'?'none':'visible')}}

map.on('load',()=>{

 map.addLayer({id:'trail',type:'line',source:'trail',paint:{'line-color':'#0a84ff','line-width':3,'line-opacity':.9}});
 map.addSource('ac',{type:'geojson',data:fc([])});
 map.addLayer({id:'ac',type:'symbol',source:'ac',layout:{'icon-image':'plane','icon-rotate':['get','trk'],'icon-rotation-alignment':'map','icon-allow-overlap':true,'icon-size':['interpolate',['linear'],['zoom'],3,.28,10,.5],
  'text-field':['step',['zoom'],'',8,['get','cs']],'text-font':['Open Sans Regular'],'text-size':11,'text-offset':[0,1.5],'text-optional':true},
  paint:{'icon-color':['case',['==',['get','sel'],1],'#0a84ff',['get','al'],'#ff453a','#ffc700'],'icon-halo-color':'rgba(0,0,0,.5)','icon-halo-width':1,'text-color':'#ffc700','text-halo-color':'rgba(0,0,0,.8)','text-halo-width':1.2}});
 map.addSource('pb',{type:'geojson',data:fc([])});
 map.addLayer({id:'pb',type:'circle',source:'pb',paint:{'circle-radius':7,'circle-color':'#fff','circle-stroke-color':'#0a84ff','circle-stroke-width':3}});

 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{map.jumpTo({center:[p.coords.longitude,p.coords.latitude]});setSelectedLocation(p.coords.latitude,p.coords.longitude,'Selected device location',true)},()=>loadWeather(selectedLocation.lat,selectedLocation.lon),{timeout:4000});else loadWeather(selectedLocation.lat,selectedLocation.lon);

async function poll(){
 const now=Date.now();if(pollPending||now-lastPollAt<15000)return;pollPending=true;lastPollAt=now;
 try{await pollCycle()}finally{pollPending=false}

async function pollCycle(){

 try{
  const r=await fetch(apiPath('/api/aircraft'),{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('AirOps API unavailable');

  try{const radius=Math.min(250,Math.max(1,Math.ceil(nm(c.lat,c.lng,b.getNorth(),b.getEast())))),result=await fetchAircraftFallback(c.lat,c.lng,radius);list=result.list;used=result.source;sourceName=result.source;transport=result.transport}

function statusLabel(){const e=$('#sourceStatus');if(!e)return;e.textContent=provider==='Offline'?'Offline · last update '+(lastSuccess?new Date(lastSuccess).toLocaleTimeString():'none'):provider+(lastSuccess?' · updated '+new Date(lastSuccess).toLocaleTimeString():'');e.title=providerError||'Provider-reported data. Without the AirOps API, history is held in this browser session only.';e.style.color=provider==='Offline'?'var(--red)':'var(--sub)'}

async function registerServiceWorker(){

async function toggleWakeLock(){

 try{if(wakeLock){keepAwake=false;await wakeLock.release();wakeLock=null;toast('Keep-awake mode off.')}else{wakeLock=await navigator.wakeLock.request('screen');keepAwake=true;wakeLock.addEventListener('release',()=>{wakeLock=null;if(!keepAwake)toast('Screen lock released.')});toast('Screen will stay awake while this page is visible.')}if(tab==='tools')panel()}catch(e){keepAwake=false;toast('Wake Lock unavailable: '+e.message)}

function capturePhoto(){const v=$('#camVideo'),c=$('#camCanvas');if(!v.videoWidth){toast('Camera is not ready yet.');return}c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(blob=>{if(!blob){toast('Could not capture a photo.');return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`airops-spotter-${new Date().toISOString().replace(/[:.]/g,'-')}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},'image/jpeg',.92)}
async function shareAircraft(copyOnly=false){const a=ac.get(sel);if(!a)return;const text=[a.cs||a.id.toUpperCase(),a.reg,a.type,a.op,`ICAO ${a.id.toUpperCase()}`,`Source ${a.source||'unknown'}`,a.observedAt?`Observed ${a.observedAt}`:null].filter(Boolean).join(' · ');try{if(!copyOnly&&navigator.share){await navigator.share({title:'AirOps aircraft observation',text,url:location.href});return}if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('Aircraft details copied.');return}const x=document.createElement('textarea');x.value=text;document.body.append(x);x.select();const ok=document.execCommand('copy');x.remove();toast(ok?'Aircraft details copied.':'Clipboard access is unavailable.')}catch(e){if(e.name!=='AbortError')toast('Share/copy failed: '+e.message)}}
async function enablePeriodicSync(){

function check(a){
 const em=emerg&&['7500','7600','7700'].includes(a.sq),hit=watch.find(w=>[a.cs,a.reg,a.id].some(x=>x&&x.toUpperCase().startsWith(w)));

function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',5000)}
function open(id){
 sel=id;pbIdx=null;tab='map';tabs();$('#panel').hidden=true;
 const s=$('#sheet');s.hidden=false;
 s.innerHTML=`<div class="grab"></div><div class="row"><div><h2 id="s1"></h2><p id="s2"></p><p id="s3"></p></div><button class="x" data-a="close">✕</button></div>
 <div class="grid"><div><b id="g1"></b><span>Altitude</span></div><div><b id="g2"></b><span>Ground speed</span></div><div><b id="g3"></b><span>Heading</span></div><div><b id="g4"></b><span>Vertical rate</span></div><div><b id="g5"></b><span>Squawk</span></div><div><b id="g6"></b><span>ICAO</span></div></div>

 <h3>Playback</h3><input type="range" id="pbr" min="0" value="0"><p id="pbt"></p>

async function loadArchivedTrack(id){
 try{
  const response=await fetch(apiPath(`/api/history/${encodeURIComponent(id)}?limit=5000`));if(!response.ok)throw Error('Archive unavailable');
  const rows=await response.json();if(!Array.isArray(rows))throw Error('Invalid archive response');
  const points=rows.map(a=>[Date.parse(a.observed_at||a.received_at),a.longitude,a.latitude,a.altitude_ft||0,a.ground_speed_kt||0,a.track_deg||0]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])&&Number.isFinite(p[2]));
  if(points.length&&sel===id){hist.set(id,points);archivedTracks.add(id);stats()}
 }catch{}
}
function stats(){
 const a=ac.get(sel);if(!a){close();return}
 const h=hist.get(sel)||[],r=$('#pbr');if(!r)return;
 const live=pbIdx===null;r.max=Math.max(h.length-1,0);r.value=live?r.max:pbIdx;
 const p=live?null:h[pbIdx];
 const alt=p?p[3]:a.alt,gs=p?p[4]:a.gs,trk=p?p[5]:a.trk;
 $('#s1').textContent=a.cs||a.reg||a.id.toUpperCase();
 $('#s2').textContent=[a.reg,a.type].filter(Boolean).join(' · ')||'Registration and type unavailable';
 $('#s3').textContent=a.op||'Operator unavailable';
 $('#g1').textContent=alt?alt.toLocaleString()+' ft':'Ground';$('#g2').textContent=gs+' kt';$('#g3').textContent=trk+'°';
 $('#g4').textContent=(a.vr>0?'+':'')+a.vr+' fpm';$('#g5').textContent=a.sq||'–';$('#g6').textContent=a.id.toUpperCase();
 const mx=Math.max(1,...h.map(x=>x[3]));
 $('#sp').innerHTML=h.length>1?`<polyline fill="none" stroke="#0a84ff" stroke-width="2" vector-effect="non-scaling-stroke" points="${h.map((x,i)=>`${i/(h.length-1)*300},${38-x[3]/mx*36}`).join(' ')}"/>`:'';
 $('#pbt').textContent=live?`Live · ${h.length} ${archivedTracks.has(sel)?'archived observations':'points recorded this session'}`:`${new Date(p[0]).toLocaleString()}${archivedTracks.has(sel)?' · archived':' · session capture'}`;
 map.getSource('trail').setData(fc(h.length>1?[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:h.map(x=>[x[1],x[2]])}}]:[]));
 map.getSource('pb').setData(fc(p?[pt(p[1],p[2])]:[]));
}
function close(){sel=null;pbIdx=null;$('#sheet').hidden=true;if(map.getSource('trail')){map.getSource('trail').setData(fc([]));map.getSource('pb').setData(fc([]));draw()}}
function tabs(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function panel(){
 const p=$('#panel');if(tab==='map'){p.hidden=true;return}
 p.hidden=false;const v=[...ac.values()];let h='<div class="grab"></div>';
 if(tab==='ana'){
  const air=v.filter(a=>a.alt>0),avg=k=>air.length?Math.round(air.reduce((s,a)=>s+a[k],0)/air.length):0;
  const w=weather,weatherBlock=w?`<div class="grid"><div><b>${esc(w.temperature_2m)} °C</b><span>Temperature</span></div><div><b>${esc(w.apparent_temperature)} °C</b><span>Feels like</span></div><div><b>${esc(w.relative_humidity_2m)}%</b><span>Humidity</span></div><div><b>${esc(w.wind_speed_10m)}</b><span>Wind speed</span></div><div><b>${esc(w.wind_direction_10m)}°</b><span>Wind direction</span></div><div><b>${esc(w.precipitation)} mm</b><span>Precipitation</span></div></div><p>Weather code ${esc(w.weather_code)} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather by Open-Meteo</a></p>`:`<p>${esc(weatherMessage)}</p><p><a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather by Open-Meteo</a></p>`;
  const bands=[['Ground',a=>a.alt===0],['< 10k ft',a=>a.alt>0&&a.alt<10000],['10–25k ft',a=>a.alt>=10000&&a.alt<25000],['25–35k ft',a=>a.alt>=25000&&a.alt<35000],['35k+ ft',a=>a.alt>=35000]].map(([n,f])=>[n,v.filter(f).length]);
  const mx=Math.max(1,...bands.map(b=>b[1])),ap=AP[apc],near=v.filter(a=>nm(a.lat,a.lon,ap[1],ap[2])<30);
  h+=`<h2>Analytics</h2><div class="grid"><div><b>${v.length}</b><span>In view</span></div><div><b>${avg('alt').toLocaleString()}</b><span>Avg alt (ft)</span></div><div><b>${avg('gs')}</b><span>Avg speed (kt)</span></div></div><h3>Weather · ${esc(selectedLocation.name)}</h3>${weatherBlock}<p>General conditions only; not an aviation weather briefing. Map clicks or place search change the selected point.</p><button class="btn s" data-a="geocoder">Location search settings</button><h3>Altitude bands</h3><div class="list">${bands.map(b=>`<div class="li"><span style="width:84px">${b[0]}</span><div style="flex:1;margin:0 10px"><div class="bar2" style="width:${b[1]/mx*100}%"></div></div><span>${b[1]}</span></div>`).join('')}</div>
  <h3>Airport traffic (30 nm)</h3><select id="ap">${Object.entries(AP).map(([k,x])=>`<option value="${k}" ${k===apc?'selected':''}>${k} · ${x[0]}</option>`).join('')}</select>

 }

function dl(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

  if(a==='watch'){const x=ac.get(sel),k=(x.cs||x.reg||x.id).toUpperCase();if(!watch.includes(k)){watch.push(k);sv('watch',watch)}toast('Watching '+k)}
  if(a==='trk'){const x=ac.get(sel);dl(`track-${sel}.json`,'application/json',JSON.stringify({aircraft:x?{icao:x.id,callsign:x.cs,registration:x.reg,type:x.type,operator:x.op}:null,source:x?.source,evidence_type:x?.evidenceType,observed_at:x?.observedAt||null,received_at:x?.receivedAt||null,points:(hist.get(sel)||[]).map(p=>({time:new Date(p[0]).toISOString(),lon:p[1],lat:p[2],alt_ft:p[3],gs_kt:p[4],track:p[5]}))},null,1))}

});
